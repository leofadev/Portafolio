<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Portafolio de Leonardo Pinto, desarrollador de software especializado en Laravel, PHP, MySQL y React."
    />
    <meta property="og:title" content="Leonardo Pinto | Desarrollador de Software" />
    <meta
      property="og:description"
      content="Proyectos y experiencia en desarrollo web con Laravel, PHP, MySQL y React."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leofadev.github.io/Portafolio/" />
    <meta name="theme-color" content="#0b1120" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Aplica el tema guardado antes de pintar para evitar el parpadeo
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
